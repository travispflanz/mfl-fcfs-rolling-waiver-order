# This is Cloudflare's own Worker config file, not a custom "app
# settings" file — everything below is either required by Cloudflare
# for any Worker to deploy at all, or fixed plumbing that worker.js
# references directly and isn't meant to be tuned. There are no
# commissioner-facing settings in this file at all: MFL_LEAGUE_URL and
# every other setting are entered under your Worker's own Settings ->
# Variables and Secrets in the Cloudflare dashboard, after you deploy.
# Full rationale: docs/DEVELOPMENT_NOTES.md.

# Required by Cloudflare for any Worker — not a setting of this bot's.
name = "mfl-waiver-order"   # optional to rename; nothing else depends on this
main = "worker.js"
compatibility_date = "2026-08-18"

# Tells Cloudflare not to wipe out dashboard-set Variables on deploy —
# needed because MFL_LEAGUE_URL and friends live only in the dashboard,
# not in this file. Without this, every push would silently delete
# them. See "Source of truth" in docs/DEVELOPMENT_NOTES.md.
keep_vars = true

# Not a setting — `STATUS_KV` is a binding name worker.js references
# directly in code. Stores last-run status for /status and failure
# alerting. No `id =` here on purpose: Cloudflare creates this
# namespace automatically on first deploy.
[[kv_namespaces]]
binding = "STATUS_KV"

# The one other real setting: checks your league every 5 minutes by
# default. Edit freely — any standard 5-field cron expression works.
# This is the one setting that has to stay here rather than in the
# dashboard — Cloudflare requires Cron Trigger schedules to be managed
# through this file, full stop, no exceptions.
[triggers]
crons = ["*/5 * * * *"]
