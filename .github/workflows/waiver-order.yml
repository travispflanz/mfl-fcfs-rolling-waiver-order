name: MFL Waiver Adjustment Check

# Runs entirely on GitHub's own hosted runners — never on any local
# machine. Checks every 5 minutes (GitHub Actions' shortest allowed
# interval) whether the computed waiver order has changed and, if so,
# submits it — otherwise it's a fast no-op (see arraysEqual() in
# scripts/update-waiver-order.mjs). Want to check less often instead?
# Edit the cron expression below — anything from "*/5 * * * *" (every 5
# minutes) up is valid, e.g. "*/30 * * * *" for every 30 minutes, or
# "0 * * * *" for hourly.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — compute and log the target order but do not submit it'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mfl-waiver-order
  cancel-in-progress: false

jobs:
  update-waiver-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Checking every 5 minutes means the Chromium download (normally the
      # slowest part of each run, ~30-60s) would otherwise repeat on every
      # single check. Cache it, keyed on package-lock.json so a Playwright
      # version bump invalidates the cache automatically.
      - name: Cache Playwright browser binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (Playwright) — cache miss only
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # EXPERIMENT (temporary): on a cache hit, skip install-deps entirely
      # and see whether GitHub's stock ubuntu-latest image already has
      # what Chromium needs. install-deps (apt-get) took ~1m46s even on a
      # cache hit in testing — if the browser launches fine without it,
      # that's the real win; if not, this step needs to come back.

      - name: Update waiver order
        env:
          MFL_LEAGUE_URL: ${{ vars.MFL_LEAGUE_URL }}
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          # Manual runs (workflow_dispatch) default to a dry run for safety;
          # the schedule always runs for real (DRY_RUN=false).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run update
