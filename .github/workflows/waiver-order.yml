name: MFL Waiver Adjustment Check

# Runs entirely on GitHub's own hosted runners — never on any local
# machine. Checks hourly by default whether the computed waiver order
# has changed and, if so, submits it — otherwise it's a fast no-op (see
# arraysEqual() in scripts/update-waiver-order.mjs). Hourly rather than
# GitHub's 5-minute floor on purpose: actual waiver processing runs on
# its own schedule (hours to days apart, not minutes), so checking more
# often than that doesn't change any real outcome, just spends more
# Actions minutes for no benefit. Want a different interval? Edit the
# cron expression below — any standard 5-field cron works, e.g.
# "*/5 * * * *" for GitHub's fastest (every 5 minutes), or
# "*/30 * * * *" for every 30.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — compute and log the target order but do not submit it'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mfl-waiver-order
  cancel-in-progress: false

jobs:
  update-waiver-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Checking every 5 minutes means the Chromium download (normally the
      # slowest part of each run, ~30-60s) would otherwise repeat on every
      # single check. Cache it, keyed on package-lock.json so a Playwright
      # version bump invalidates the cache automatically.
      - name: Cache Playwright browser binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # Confirmed live (2026-08-17): GitHub's stock ubuntu-latest image
      # already has every OS-level library Chromium needs, so a cache hit
      # can skip `playwright install-deps` entirely — cut a cache-hit run
      # from ~2m to ~25s. That step (apt-get) doesn't benefit from the
      # cache above regardless, since installed OS packages don't persist
      # between runs on a fresh Actions VM — only this file-based Chromium
      # binary path does. If a future runner image ever lacks something
      # Chromium needs, this step is what to reintroduce (guarded the same
      # way `Install Chromium` is above).
      - name: Install Chromium (Playwright) — cache miss only
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Update waiver order
        env:
          MFL_LEAGUE_URL: ${{ vars.MFL_LEAGUE_URL }}
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          # Manual runs (workflow_dispatch) default to a dry run for safety;
          # the schedule always runs for real (DRY_RUN=false).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm run update
